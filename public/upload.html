<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Archivo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #aaa;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Subir Archivo al Servidor</h2>

    <div class="form-group">
        <input type="file" id="fileInput">
    </div>

    <button id="uploadBtn" onclick="uploadFile()">Enviar Archivo</button>

    <div id="status"></div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const statusDiv = document.getElementById('status');
            const uploadBtn = document.getElementById('uploadBtn');

            if (fileInput.files.length === 0) {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Por favor, selecciona un archivo primero.";
                return;
            }

            const file = fileInput.files[0];
            uploadBtn.disabled = true;
            statusDiv.style.color = "black";
            statusDiv.innerText = "Enviando archivo...";

            try {
                // Lee el archivo directamente en formato binario (ArrayBuffer)
                const fileData = await file.arrayBuffer();

                // Petición POST enviando los bytes directos en el cuerpo
                const response = await fetch('/api/v1/files/upload', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/octet-stream'
                    },
                    body: fileData
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.style.color = "green";
                    statusDiv.innerText = `Éxito: ${result.message} (${result.bytes_written} bytes guardados)`;
                } else {
                    statusDiv.style.color = "red";
                    statusDiv.innerText = `Error (${response.status}): ${result.message || 'Falló la subida'}`;
                }

            } catch (err) {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Error en la conexión con el servidor.";
                console.error(err);
            } finally {
                uploadBtn.disabled = false;
            }
        }
    </script>

</body>
</html>
